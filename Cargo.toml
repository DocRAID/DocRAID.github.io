[package]
name = "tui_blog"
version = "0.1.0"
authors = ["DocRAID <l01062506145@gmail.com>"]
license = "MIT"
edition = "2021"

[dependencies]
ratatui = { version = "0.29.0", default-features = false }
ratzilla = "0.2.0"
log = "0.4"
console_log = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = { version = "0.3", default-features = false, features = ["std"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Request",
    "RequestInit",
    "RequestCache",
    "RequestMode",
    "Response",
    "Window",
    "History",
    "Storage",
    "Event",
    "Document",
] }