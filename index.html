<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dongju Lim's personal technical blog. Study · Think · Logging."
    />
    <meta property="og:title" content="tui_blog — Dongju Lim" />
    <meta
      property="og:description"
      content="Dongju Lim's personal technical blog. Study · Think · Logging."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://docraid.github.io/" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Dongju Lim — tui_blog</title>
    <base href="/" />
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="tui_blog" data-wasm-opt="z" />
    <link data-trunk rel="copy-file" href="notion.json" />
    <link data-trunk rel="copy-file" href="favicon.svg" />
    <link data-trunk rel="copy-dir" href="assets/fonts" data-target-path="fonts" />
    <style>
      @font-face {
        font-family: "Fira Code";
        src: url("/fonts/FiraCode-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #121212;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        align-content: center;
      }
      pre,
      pre span {
        font-family: "Fira Code", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
        font-size: 16px !important;
        font-weight: 400 !important;
        font-synthesis: none;
        margin: 0px;
      }
      #post-images {
        position: fixed;
        overflow: hidden;
        pointer-events: none;
        z-index: 5;
      }
      #post-images a {
        position: absolute;
        display: block;
        pointer-events: auto;
        cursor: pointer;
      }
      #post-images img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
        background-color: #1c1916;
      }
    </style>
  </head>
